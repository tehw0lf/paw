[project]
name="paw"
version="2.0.3"
description="paw - patterns and wordlists in python"
readme = "README.md"
authors = [
    { name = "tehw0lf", email = "tehwolf@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "wlgen>=2.0.7",
]
[dependency-groups]
dev = [
  "mock"
]
lint = [
  "ruff"
]
[project.scripts]
paw = "paw:main"

[tool.ruff]
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
